server {
    listen 80;
    server_name 89.169.177.21;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location /media/ {
        alias /home/ubuntu/new_app_django/online_learning_platform/media/;
    }
}
