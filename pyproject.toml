[project]
name = "online-learning-platform"
version = "0.1.0"
description = ""
authors = [
    {name = "Kseniya Shaykhvalieva",email = "kseniyashajhvalieva@gmail.com"}
]
requires-python = ">=3.13,<4.0"
dependencies = [
    "django (>=6.0.6,<7.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "django-filter (>=25.2,<26.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "ipython (>=9.14.1,<10.0.0)",
    "coverage (>=7.14.3,<8.0.0)",
    "drf-spectacular (>=0.29.0,<0.30.0)",
    "stripe (>=15.3.0,<16.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "eventlet (>=0.41.0,<0.42.0)",
    "redis (==4.6.0)",
    "django-celery-beat (>=2.9.0,<3.0.0)",
    "gunicorn (>=26.0.0,<27.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)"
]
lint = [
    "mypy (>=2.1.0,<3.0.0)"
]

[tool.black]
line-length = 119

[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = "venv|__pycache__"

package-mode = false

[tool.poetry]
packages = [{include = "config"}, {include = "materials"}, {include = "users"}]
